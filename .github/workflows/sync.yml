name: Sync Odoo Modules

on:
  schedule:
    - cron: "0 3 * * *"  # Every night at 3AM
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install .

      - name: Run sync
        env:
          GITHUB_ORG_NAME: todoltd
          GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL: https://qdrant.todo.ltd
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          POSTGRESQL_DB_HOST: 188.245.115.159
          POSTGRESQL_DB_NAME: reposync
          POSTGRESQL_DB_USER: github
          POSTGRESQL_DB_PASSWORD: ${{ secrets.POSTGRESQL_DB_PASSWORD }}
          REPOS_DIR: /opt/repo-sync/repos
        run: repo-sync
